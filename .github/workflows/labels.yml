# 이슈 라벨을 코드로 관리한다.
#
# 라벨 구성은 research/README.md 의 "라벨" 절이 정본이고, 이 파일은 그것을
# 실제로 만드는 자리다. 둘을 함께 고친다.
#
# 손으로 웹에서 만들지 않는 이유: 저장소를 옮기거나 다시 만들 때 라벨이
# 함께 따라오지 않는다. 여기 적어 두면 Actions 탭에서 한 번 눌러 되살린다.
#
# 실행: Actions 탭 → "이슈 라벨 만들기" → Run workflow
# --force 라 여러 번 돌려도 안전하다. 이미 있으면 색과 설명만 갱신한다.

name: 이슈 라벨 만들기

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - name: 라벨 만들기·갱신
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          put() { gh label create "$1" --color "$2" --description "$3" --force; }
          put "고개조사" "0E5A8A" "대전 고개 지명 조사 (research/)"
          put "제보환영" "0E8A16" "고지도를 못 읽어도 답할 수 있는 이슈. 회원 제보 환영"
          put "홈페이지" "6E5494" "사이트 자체 문제 — 페이지·레이아웃·배포"
          echo "--- 지금 라벨 ---"
          gh label list
