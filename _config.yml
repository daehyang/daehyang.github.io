title: 대전향토문화연구회
title_hanja: 大田鄕土文化硏究會
description: 대전의 향토문화를 조사·연구하고, 그 성과를 위키미디어와 연결해 오래 남기는 연구 모임입니다.
url: "https://daehyang.github.io"
baseurl: ""
lang: ko
timezone: Asia/Seoul

# 기관 정보 (푸터·메타에 사용)
org:
  founded: 2019-06-17
  journal: 대전향토연구
  wikidata: Q141162117
  isni: "0000 0005 3077 2340"
  email: ""   # 대표 메일 확정 후 기입

markdown: kramdown
permalink: /notice/:year/:month/:day/:title/

# 공개 목록 — 향토문화 ID 한 건이 문서 한 장. /id/<ID>/ 로 열린다.
# 문서는 internal 저장소의 tools/export_public.py 가 만든다. 직접 고치지 않는다.
# 주소는 각 문서의 permalink으로 정한다 (아래 :name 은 대비용 기본값이며,
# 슬러그화 때 대문자가 소문자로 바뀌므로 실제로는 쓰지 않는다).
collections:
  placenames:
    output: true
    permalink: /id/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: placenames
    values:
      layout: placename
  - scope:
      path: ""
    values:
      layout: page

# GitHub Pages 기본 플러그인
plugins:
  - jekyll-feed
  - jekyll-sitemap

# 사이트에 내보내지 않는 파일 (저장소 문서·로컬 미리보기용)
exclude:
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
