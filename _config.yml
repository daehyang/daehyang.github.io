title: 대전향토문화연구회
title_hanja: 大田鄕土文化硏究會
description: 대전의 향토문화를 조사·연구하고, 그 성과를 위키미디어와 연결해 오래 남기는 연구 모임입니다.
url: "https://daehyang.github.io"
baseurl: ""
lang: ko
timezone: Asia/Seoul

# 기관 정보 (푸터·메타에 사용)
org:
  founded: 2019-06-17
  journal: 대전향토연구
  wikidata: Q141162117
  isni: "0000 0005 3077 2340"
  # 국립중앙도서관 전거번호. 이 번호 자체는 영구 식별자다.
  nlk: KAB202604522
  # 그 번호로 여는 화면의 주소 틀. 뒤에 nlk 를 이어 붙여 쓴다.
  # 사서지원서비스의 저자전거 화면인데, 연구회 이름으로 등록된 소장자료까지
  # 함께 보여 주기 때문에 이곳을 쓴다.
  #
  # 주의: id= 뒤의 전거번호는 바뀌지 않지만 앞의 경로(L20101000000.do)는
  # 도서관 화면 개편에 따라 바뀔 수 있다. 그때는 이 한 줄만 고치면
  # 사이트 전체가 따라온다. 기계 판독용 영구 주소가 필요하면
  # 위키데이터 P5034 가 정한 https://lod.nl.go.kr/resource/<번호> 를 쓴다.
  #
  # 이 주소가 죽었을 때 새 주소를 찾는 곳: ISNI 기록의 Notes 항목이
  # 'Korea Authority File' 로 같은 주소를 담고 있다(국립중앙도서관이 ISNI 에
  # 제출한 값이다). https://isni.org/isni/0000000530772340 에서 확인한다.
  nlk_url: "https://librarian.nl.go.kr/LI/contents/L20101000000.do?id="
  # 공식 연락처. 푸터와 소개 페이지가 이 값을 참조한다 — 바뀌면 여기만 고친다.
  address: 대전광역시 대덕구 아리랑로 211 상가동 202호
  phone: 042-252-3305
  # 네이버 밴드 주소. 비워 두면 푸터에 링크이 나타나지 않는다.
  # band.us/@dj2019 는 열리지 않았다(2026-08-26 확인). 올바른 주소를 얻는 방법:
  #   PC 웹에서 band.us 로그인 → 해당 밴드 열기 → 주소창의
  #   https://band.us/band/<숫자> 를 그대로 쓴다. 이 숫자 주소가 가장 안정적이다.
  # 공개 밴드로 '밴드 주소'를 따로 설정했다면 https://band.us/@<주소> 도 쓸 수 있다.
  # 비공개 밴드라면 외부인이 열 수 없으니 홈페이지에 걸지 않는다.
  band: ""
  email: ""   # 대표 메일이 생기면 기입 (지금은 전화와 밴드로 받는다)

markdown: kramdown
permalink: /notice/:year/:month/:day/:title/

# 공개 목록 — 향토문화 ID 한 건이 문서 한 장. /id/<ID>/ 로 열린다.
# 문서는 internal 저장소의 tools/export_public.py 가 만든다. 직접 고치지 않는다.
# 주소는 각 문서의 permalink으로 정한다 (아래 :name 은 대비용 기본값이며,
# 슬러그화 때 대문자가 소문자로 바뀌므로 실제로는 쓰지 않는다).
collections:
  placenames:
    output: true
    permalink: /id/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: placenames
    values:
      layout: placename
  - scope:
      path: ""
    values:
      layout: page

# GitHub Pages 기본 플러그인
plugins:
  - jekyll-feed
  - jekyll-sitemap

# 사이트에 내보내지 않는 파일 (저장소 문서·로컬 미리보기용)
exclude:
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
