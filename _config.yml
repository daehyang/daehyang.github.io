title: 대전향토문화연구회
title_hanja: 大田鄕土文化硏究會
description: 대전의 향토문화를 조사·연구하고, 그 성과를 위키미디어와 연결해 오래 남기는 연구 모임입니다.
url: "https://daehyang.github.io"
baseurl: ""
lang: ko
timezone: Asia/Seoul

# 기관 정보 (푸터·메타에 사용)
org:
  founded: 2019-06-17
  journal: 대전향토연구
  # 회지 ISSN. 2024-06-11 부여. ISSN 포털에서 'Confirmed record'(인쇄본)로 확인된다.
  # https://portal.issn.org/resource/ISSN/3058-2369
  journal_issn: "3058-2369"
  wikidata: Q141162117
  # 한국어 위키백과 문서 제목. 주소는 ko.wikipedia.org/wiki/ 뒤에 이어 붙인다.
  # 위키데이터 Q141162117 의 사이트링크와 같은 문서다 — 문서가 옮겨지면 여기를 고친다.
  # 연구회가 자기 문서를 직접 고치는 것은 이해충돌로 본다. 사실이 틀리면
  # 문서를 편집하지 말고 토론 문서에 근거를 대고 요청한다.
  wikipedia: 대전향토문화연구회
  isni: "0000 0005 3077 2340"
  # 국립중앙도서관 전거번호. 이 번호 자체는 영구 식별자다.
  nlk: KAB202604522
  # 그 번호로 여는 화면의 주소 틀. 뒤에 nlk 를 이어 붙여 쓴다.
  # 사서지원서비스의 저자전거 화면인데, 연구회 이름으로 등록된 소장자료까지
  # 함께 보여 주기 때문에 이곳을 쓴다.
  #
  # 주의: id= 뒤의 전거번호는 바뀌지 않지만 앞의 경로(L20101000000.do)는
  # 도서관 화면 개편에 따라 바뀔 수 있다. 그때는 이 한 줄만 고치면
  # 사이트 전체가 따라온다. 기계 판독용 영구 주소가 필요하면
  # 위키데이터 P5034 가 정한 https://lod.nl.go.kr/resource/<번호> 를 쓴다.
  #
  # 이 주소가 죽었을 때 새 주소를 찾는 곳: ISNI 기록의 Notes 항목이
  # 'Korea Authority File' 로 같은 주소를 담고 있다(국립중앙도서관이 ISNI 에
  # 제출한 값이다). https://isni.org/isni/0000000530772340 에서 확인한다.
  nlk_url: "https://librarian.nl.go.kr/LI/contents/L20101000000.do?id="
  # 공식 연락처. 푸터와 소개 페이지가 이 값을 참조한다 — 바뀌면 여기만 고친다.
  address: 대전광역시 대덕구 아리랑로 211 상가동 202호
  phone: 042-252-3305
  # 네이버 밴드. 비워 두면 푸터에서 링크가 사라진다(값이 있을 때만 나타난다).
  # 정규 주소는 www 를 붙인 쪽이다 — band.us/band/<숫자> 는 301 로 옮겨진다.
  # 이 밴드는 로그인해야 보이는 회원 밴드다(2026-08-26 확인: 익명 요청에
  # Open Graph 메타가 없고 밴드 이름도 나오지 않는다). 그래서 푸터 이름표에
  # '회원용' 을 붙여 방문자가 로그인 창을 만날 것을 미리 알 수 있게 했다.
  # band.us/@dj2019 형태는 열리지 않았다 — '밴드 주소'를 설정한 공개 밴드만 쓴다.
  band: https://www.band.us/band/75349980
  email: ""   # 대표 메일이 생기면 기입 (지금은 전화와 밴드로 받는다)

markdown: kramdown
permalink: /notice/:year/:month/:day/:title/

# 공개 목록 — 향토문화 ID 한 건이 문서 한 장. /id/<ID>/ 로 열린다.
# 문서는 internal 저장소의 tools/export_public.py 가 만든다. 직접 고치지 않는다.
# 주소는 각 문서의 permalink으로 정한다 (아래 :name 은 대비용 기본값이며,
# 슬러그화 때 대문자가 소문자로 바뀌므로 실제로는 쓰지 않는다).
collections:
  placenames:
    output: true
    permalink: /id/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: placenames
    values:
      layout: placename
  - scope:
      path: ""
    values:
      layout: page

# GitHub Pages 기본 플러그인
plugins:
  - jekyll-feed
  - jekyll-sitemap

# 사이트에 내보내지 않는 파일 (저장소 문서·로컬 미리보기용)
exclude:
  - CLAUDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  # 발간 전 조사 자료. 저장소에서는 보이되 홈페이지에는 싣지 않는다.
  # 확정 전 메모가 사이트 주소로 열리면 확정 자료로 오해받는다.
  - research
